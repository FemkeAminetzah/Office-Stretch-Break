<!doctype html>
<html lang="en" style="color-scheme: light dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indoma Stretch Break</title>
<style>
:root{--bg:#F3EFE6;--card:#FBF9F4;--ink:#3A2B25;--mute:#6F625B;--line:#E2D9C9;--accent:#9A5A3C;--accent-ink:#fff;--copper:#BD835B;--water:#8DB4C8;--coffee:#7A4A33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1815;--card:#2A221E;--ink:#F3EFE6;--mute:#B3A69D;--line:#3D332D;--accent:#D9976C;--accent-ink:#2A1A12;--copper:#D9976C;--water:#7FA8BD;--coffee:#A06A48}}
:root[data-theme="dark"]{--bg:#1E1815;--card:#2A221E;--ink:#F3EFE6;--mute:#B3A69D;--line:#3D332D;--accent:#D9976C;--accent-ink:#2A1A12;--copper:#D9976C;--water:#7FA8BD;--coffee:#A06A48}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
.brand{background:#F3EFE6;border-radius:14px;padding:18px 20px;margin-bottom:14px;text-align:center}
.brand img{width:100%;max-width:360px;height:auto;display:block;margin:0 auto}
h1{font-size:1.35rem;margin:0 0 2px;letter-spacing:.02em}
p.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.status{font-size:1.1rem;font-weight:600}
.note{color:var(--mute);font-size:.9rem;margin-top:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{font-size:.9rem;color:var(--mute)}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
#reminder{display:none;border:2px solid var(--copper)}
#reminder h2{margin:0 0 6px;font-size:1.25rem}
#reminder p{margin:0 0 14px}
.demo{background:var(--bg);border-radius:12px;display:flex;justify-content:center;padding:8px;margin-bottom:12px}
.demo svg,.demo img{width:100%;max-width:240px;height:auto;display:block}
.demo svg *{fill:none;stroke:var(--copper);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.demo svg clipPath *{fill:#000;stroke:none}
.demo svg #fh{fill:var(--copper);stroke:none}
.demo svg #fg{stroke:var(--line);stroke-width:3}
.demo svg .cup{stroke-width:6}
.demo svg .steam{stroke-width:4}
.demo svg #wLevel{fill:var(--water);stroke:none}
.demo svg #cLevel{fill:var(--coffee);stroke:none}
</style>
</head>

<script>
// Pose = [torso lean, head tilt, L upper arm, L forearm, R upper arm, R forearm, L thigh, L shin, R thigh, R shin, lift]
// Angles in degrees: 0 = pointing down, 90 = screen right, 180 = up, -90 = screen left.
const P=o=>[o.t||0,o.h||0,o.a1??-8,o.a2??-8,o.b1??8,o.b2??8,o.c1??-3,o.c2??-3,o.d1??3,o.d2??3,o.l||0];
// slug = optional real GIF at images/<slug>.gif (replaces the drawn figure when the file exists)
const STRETCHES=[
{n:"Neck tilt",slug:"neck-tilt",t:"Drop your right ear toward your right shoulder. Hold 20 seconds, then switch sides.",A:P({h:-28}),B:P({h:28})},
{n:"Overhead reach",slug:"overhead-reach",t:"Interlace your fingers and reach both arms up. Hold 20 seconds, breathing slowly.",A:P({}),B:P({a1:190,a2:190,b1:170,b2:170})},
{n:"Side bend",slug:"side-bend",t:"Reach both arms overhead and lean gently to one side. Hold 20 seconds per side.",A:P({t:-22,a1:205,a2:205,b1:205,b2:205}),B:P({t:22,a1:155,a2:155,b1:155,b2:155})},
{n:"Chest opener",slug:"chest-opener",t:"Draw your elbows back and open your arms wide, squeezing your shoulder blades. Hold 20 seconds.",A:P({a1:-20,a2:120,b1:20,b2:240}),B:P({a1:-100,a2:-105,b1:100,b2:105})},
{n:"Calf raises",slug:"calf-raises",t:"Rise onto your toes, then lower slowly. 15 repetitions.",A:P({}),B:P({l:9})},
{n:"Side lunge",slug:"side-lunge",t:"Step wide, bend one knee and keep the other leg straight. Hold 20 seconds per side. Skip it if your knees hurt.",A:P({}),B:P({l:-12,c1:-32,c2:-32,d1:40,d2:0,a1:-15,b1:15})}
];
STRETCHES.forEach(s=>s.kind='stretch');
const WATER={kind:'water',n:'Water break',slug:'water-break',t:'Time for a glass of water. Take a few minutes away from your screen.'};
const COFFEE={kind:'coffee',n:'Coffee break',slug:'coffee-break',t:'Grab a coffee or tea and step away from your desk for a few minutes.'};
const ALL=[...STRETCHES,WATER,COFFEE];
const COFFEE_HOURS=[11,15];
const NAMES={stretch:'stretch',water:'water break',coffee:'coffee break'};

const $=id=>document.getElementById(id);
const rad=a=>a*Math.PI/180,X=a=>Math.sin(rad(a)),Y=a=>Math.cos(rad(a));
const ease=x=>.5-.5*Math.cos(Math.PI*x);

function fig(p){
  const hip=[100,140-p[10]],tl=rad(p[0]);
  const neck=[hip[0]+50*Math.sin(tl),hip[1]-50*Math.cos(tl)];
  const ls=[neck[0]-16*Math.cos(tl),neck[1]-16*Math.sin(tl)],rs=[neck[0]+16*Math.cos(tl),neck[1]+16*Math.sin(tl)];
  const hd=rad(p[0]+p[1]),head=[neck[0]+20*Math.sin(hd),neck[1]-20*Math.cos(hd)];
  const ch=(o,a,b,l1,l2)=>{const m=[o[0]+l1*X(a),o[1]+l1*Y(a)];return [o,m,[m[0]+l2*X(b),m[1]+l2*Y(b)]];};
  return {head,lines:[[hip,neck],[ls,rs],ch(ls,p[2],p[3],34,30),ch(rs,p[4],p[5],34,30),ch([hip[0]-9,hip[1]],p[6],p[7],44,42),ch([hip[0]+9,hip[1]],p[8],p[9],44,42)]};
}
function draw(p){
  const f=fig(p);
  $('fh').setAttribute('cx',f.head[0]);$('fh').setAttribute('cy',f.head[1]);
  f.lines.forEach((l,i)=>$('f'+i).setAttribute('points',l.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')));
}
function level(el,bottom,max,v){const top=bottom-v*max;el.setAttribute('y',top);el.setAttribute('height',Math.max(0,bottom+4-top));}
function cup(kind,p){
  if(kind==='water'){ // the glass empties over 3 s, rests, then refills
    level($('wLevel'),210,118,p<3000?1-ease(p/3000):p<3600?0:ease((p-3600)/900));
  }else{ // the mug fills over 3 s, then steams
    const v=p<3000?ease(p/3000):1;
    level($('cLevel'),200,88,v);
    $('steam').style.opacity=v>.95?.35+.35*Math.sin(p/300):0;
  }
}
let raf=0;
function play(ex){
  cancelAnimationFrame(raf);
  const t0=performance.now();
  const step=now=>{
    const t=now-t0;
    if(ex.kind==='stretch'){const e=ease((t/1500)%2<1?(t/1500)%1:1-(t/1500)%1);draw(ex.A.map((v,i)=>v+(ex.B[i]-v)*e));}
    else cup(ex.kind,t%4500);
    raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
}
function showMedia(ex){
  const img=$('rImg'),svgs={stretch:$('fig'),water:$('cupW'),coffee:$('cupC')};
  Object.keys(svgs).forEach(k=>svgs[k].style.display=k===ex.kind?'block':'none');
  img.hidden=true;
  img.onload=()=>{img.hidden=false;svgs[ex.kind].style.display='none';cancelAnimationFrame(raf);};
  img.onerror=()=>{img.hidden=true;svgs[ex.kind].style.display='block';};
  img.src='images/'+ex.slug+'.gif';
  play(ex);
}

let cfg={on:false,start:10,end:17,every:1,water:true,coffee:true};
try{const s=localStorage.getItem('stretch-cfg');if(s)cfg={...cfg,...JSON.parse(s)};}catch(e){}
const save=()=>{try{localStorage.setItem('stretch-cfg',JSON.stringify(cfg));}catch(e){}};
let queue=[],cur=null,snoozes=[],fired=new Set(),flash=null,testIdx=0;

const isSlot=d=>{const w=d.getDay(),h=d.getHours();return w>=1&&w<=5&&h>=cfg.start&&h<=cfg.end&&(h-cfg.start)%cfg.every===0;};
// Which breaks are scheduled at exactly this time (minutes 0 or 30)
function scheduled(d){
  const w=d.getDay(),h=d.getHours(),m=d.getMinutes(),out=[];
  if(w<1||w>5)return out;
  if(m===0&&isSlot(d))out.push('stretch');
  if(m===0&&cfg.coffee&&COFFEE_HOURS.includes(h))out.push('coffee');
  if(m===30&&cfg.water&&h>=cfg.start&&h<=cfg.end)out.push('water');
  return out;
}
// Breaks that became due now (allows a few minutes of browser throttling); each slot fires once
function dueNow(now){
  const m=now.getMinutes();if(m%30>=5)return [];
  const slot=new Date(now);slot.setMinutes(m<30?0:30,0,0);
  const k=slot.getTime();if(fired.has(k))return [];
  fired.add(k);return scheduled(slot);
}
function nextEvent(){
  const d=new Date();d.setMinutes(d.getMinutes()<30?30:60,0,0);
  for(let i=0;i<400;i++,d.setMinutes(d.getMinutes()+30)){const t=scheduled(d);if(t.length)return {d:new Date(d),t};}
  return null;
}
const pick=d=>STRETCHES[Math.floor(d.getTime()/3600000)%STRETCHES.length];
const itemFor=(t,now)=>t==='stretch'?pick(now):t==='water'?WATER:COFFEE;
const title=it=>it.kind==='stretch'?'Time to stretch: '+it.n:it.n;
const hm=d=>d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

function notify(t,b){try{if('Notification' in window&&Notification.permission==='granted')new Notification(t,{body:b});}catch(e){}}
function fire(it){
  $('rName').textContent=title(it);
  $('rText').textContent=it.t;
  $('reminder').style.display='block';
  showMedia(it);
  notify(title(it),it.t);
  clearInterval(flash);let on=false;
  flash=setInterval(()=>{document.title=(on=!on)?'⏰ Break time!':'Indoma Stretch Break';},1000);
}
function hide(){$('reminder').style.display='none';cancelAnimationFrame(raf);clearInterval(flash);document.title='Indoma Stretch Break';}
function next(){cur=queue.shift()||null;if(cur)fire(cur);else hide();}
function enqueue(items){if(!items.length)return;queue.push(...items);if(!cur)next();}

function render(now){
  let s='Reminders are off';
  if(cfg.on){
    if(snoozes.length)s='Snoozed until '+hm(new Date(Math.min(...snoozes.map(x=>x.until))));
    else{const n=nextEvent();
      if(!n)s='No upcoming reminders';
      else{const m=Math.round((n.d-now)/60000);
        s='Next: '+n.t.map(x=>NAMES[x]).join(' + ')+' at '+hm(n.d)+(n.d.toDateString()===now.toDateString()?' (in '+m+' min)':' on '+n.d.toLocaleDateString([], {weekday:'long'}));}}
  }
  $('status').textContent=s;
  $('toggle').textContent=cfg.on?'Turn off reminders':'Turn on reminders';
  $('rMore').textContent=queue.length?'Next up: '+title(queue[0]):'';
  let p='';
  try{p='Notification' in window?(Notification.permission==='granted'?'Desktop notifications are allowed.':Notification.permission==='denied'?'Desktop notifications are blocked in your browser settings. You will still see reminders on this page.':'Turn on reminders to allow desktop notifications.'):'This browser does not support desktop notifications.';}catch(e){}
  $('perm').textContent=p;
}
function tick(){
  const now=new Date();
  if(cfg.on){
    const due=snoozes.filter(s=>now.getTime()>=s.until);
    if(due.length){snoozes=snoozes.filter(s=>!due.includes(s));enqueue(due.map(s=>s.item));}
    enqueue(dueNow(now).map(t=>itemFor(t,now)));
  }
  render(now);
}

for(let h=5;h<=22;h++){for(const id of ['start','end']){const e=document.createElement('option');e.value=h;e.textContent=String(h).padStart(2,'0')+':00';$(id).appendChild(e);}}
$('start').value=cfg.start;$('end').value=cfg.end;$('every').value=cfg.every;
['start','end','every'].forEach(k=>$(k).addEventListener('change',e=>{cfg[k]=+e.target.value;save();tick();}));
['water','coffee'].forEach(k=>{$(k).checked=cfg[k];$(k).addEventListener('change',e=>{cfg[k]=e.target.checked;save();tick();});});

$('toggle').addEventListener('click',async()=>{
  cfg.on=!cfg.on;save();
  if(cfg.on){dueNow(new Date());snoozes=[];
    try{if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission();}catch(e){}}
  else{queue=[];snoozes=[];next();}
  tick();
});
$('test').addEventListener('click',()=>{queue.unshift(ALL[testIdx++%ALL.length]);next();});
$('done').addEventListener('click',next);
$('skip').addEventListener('click',next);
$('snooze').addEventListener('click',()=>{if(cur)snoozes.push({until:Date.now()+600000,item:cur});next();tick();});

setInterval(tick,1000);tick();
</script>
